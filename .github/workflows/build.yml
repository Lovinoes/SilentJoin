name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Build
        run: ./gradlew build

      - name: Check tag matches the plugin version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          jar="build/libs/SilentJoin-${GITHUB_REF_NAME#v}.jar"
          if [ ! -f "$jar" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in build.gradle.kts"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: SilentJoin
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: SilentJoin
          path: dist

      - name: Publish GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/*.jar --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
